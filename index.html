<!DOCTYPE html>
<html>
  <head>

      <title>the Linlin site:3</title>

    <style>
      body {
        margin: 0;
        padding: 10px;
        
        background-image: url(bgs/dark_dot.png);
        background-repeat: repeat;
        background-position: center;
        background-size: 15px 15px;
      }
      
      aside {
        width: 300px;
        height: 400px;
        /* background-image: url(bgs/dark_dot.png); */

        position: absolute;
      }

      .grid {
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        gap: 5px;
        flex-wrap: wrap;
      }

      main {
        max-width: 850px;
        height: auto;
        background-color: #b8e0b1;
        border: 4px double #2e302d;
        color: #3d3038;

        margin-left: 3.5px;
        padding: 10px;
      } 

      main h1 {
        font-size: 4rem;
      }

      main p {
        font-size: 2rem;
      }
    </style>
    
  </head>

  <body>
    <aside></aside>
    
    <div class="grid">
      <main>
        <img src="gifs/welcometo.gif">
        <h1 class="font-pixelta">Linlinanimator.fun!</h1>
        <p>have fun<3</p>
      </main>
      
    </div>

</html>
